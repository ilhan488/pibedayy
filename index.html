<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ♡</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #fff7fb;
  color: #4b3541;
  overflow-x: hidden;
}
#cover {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff7fb;
  transition: opacity .7s ease, visibility .7s ease;
}
#cover.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.tap {
  text-align: center;
  cursor: pointer;
  user-select: none;
  animation: float 1.8s ease-in-out infinite;
}
.heart { font-size: 58px; margin-bottom: 8px; }
.tap h1 { margin: 0; font-size: 30px; }
.tap p { opacity: .65; margin-top: 10px; }
.wrap {
  width: min(700px, 100%);
  margin: auto;
  padding: 35px 18px 50px;
  text-align: center;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .8s ease, transform .8s ease;
}
.wrap.show { opacity: 1; transform: translateY(0); }
h1 { font-size: 34px; margin: 8px 0; }
.sub { font-size: 15px; opacity: .7; margin-bottom: 22px; }
.card {
  background: white;
  border-radius: 24px;
  padding: 14px;
  box-shadow: 0 10px 30px rgba(100,60,80,.12);
}
.card img {
  width: 100%;
  height: 600px;
  object-fit: cover;
  border-radius: 18px;
  display: block;
  transition: opacity .45s ease;
}
.message {
  margin: 24px auto 0;
  line-height: 1.7;
  font-size: 16px;
  max-width: 560px;
}
.count { margin-top: 12px; font-size: 12px; opacity: .5; }
.music {
  position: fixed;
  right: 14px;
  bottom: 14px;
  z-index: 5;
  background: white;
  padding: 9px 13px;
  border-radius: 999px;
  box-shadow: 0 5px 20px rgba(0,0,0,.1);
  font-size: 13px;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@media(max-width:600px) {
  .card img { height: 520px; }
}
</style>
</head>

<body>
<div id="cover" onclick="startSurprise()">
  <div class="tap">
    <div class="heart">♡</div>
    <h1>Tap for a surprise</h1>
    <p>I've got something for you...</p>
  </div>
</div>

<div class="wrap" id="content">
  <div style="font-size:28px">♡</div>
  <h1>Happy Birthday, You!</h1>
  <div class="sub">A little page made just for you</div>

  <div class="card">
    <img id="photo" src="photo1.jpeg" alt="Our photo">
  </div>

  <div class="count" id="count">1 / 7</div>

  <div class="message">
    I hope your birthday is filled with happiness, laughter and
    all the little things that make you smile. ♡<br>
    Thank you for being you.
  </div>
</div>

<audio id="music" src="cinderella.mp3" loop preload="auto"></audio>
<div class="music">♫ Cinderella</div>

<script>
const photos = ['photo1.jpeg', 'photo2.jpeg', 'photo3.jpeg', 'photo4.jpeg', 'photo5.jpeg', 'photo6.jpeg', 'photo7.jpeg'];
let index = 0;
let started = false;

function startSurprise() {
  if (started) return;
  started = true;

  const cover = document.getElementById("cover");
  const content = document.getElementById("content");
  const music = document.getElementById("music");

  // User interaction unlocks audio autoplay.
  music.currentTime = 0;
  music.play().catch(() => {});

  cover.classList.add("hide");
  setTimeout(() => content.classList.add("show"), 250);

  // Auto-slide every 3.5 seconds.
  if (photos.length > 1) {
    setInterval(() => {
      const img = document.getElementById("photo");
      img.style.opacity = "0";
      setTimeout(() => {
        index = (index + 1) % photos.length;
        img.src = photos[index];
        document.getElementById("count").textContent =
          `${index + 1} / ${photos.length}`;
        img.style.opacity = "1";
      }, 450);
    }, 3500);
  }
}
</script>
</body>
</html>
